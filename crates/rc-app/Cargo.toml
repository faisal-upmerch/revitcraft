[package]
name = "revitcraft"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui_dock = "0.21"
egui_extras = "0.36.2"
glam = "0.34.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
rc-core = { version = "0.1.0", path = "../rc-core" }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Globalization", "Win32_System_Com", "Foundation", "Data_Pdf", "Storage", "Storage_Streams"] }
