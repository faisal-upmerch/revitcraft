[package]
name = "arcus-dwg"
version = "0.1.0"
edition = "2021"
publish = false
license = "LicenseRef-Arcus-Proprietary"
description = "Arcus DWG helper: converts DWG to DXF and DXF to DWG with acadrust, run by Arcus as a separate local program."

[[bin]]
name = "arcus-dwg"
path = "src/main.rs"

[dependencies]
acadrust = "=0.6.5"
libc = "0.2"

# Standalone: not part of the RevitCraft reference workspace at the repo root.
[workspace]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Panics must unwind so the helper can catch them and report a plain error instead of crashing.
panic = "unwind"
strip = true
